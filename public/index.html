<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>What I Listen — OBS</title>
    <link rel="stylesheet" href="/overlay.css">
    </head>
  <body>
    <main id="now-playing" aria-live="polite">
      <div class="equalizer" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span><span></span>
      </div>
      <div class="visual-ripples" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="visual-orb" aria-hidden="true"></div>
      <div class="cover-wrap"><img id="cover" alt="Pochette de l'album"></div>
      <div class="text">
        <div class="label">À l'écoute</div>
        <div id="title">Aucun morceau</div>
        <div id="artist"></div>
        <div id="album"></div>
        <div class="status"><span class="dot"></span><span id="status"></span></div>
      </div>
    </main>
    <script src="/overlay.js"></script>
  </body>
</html>
